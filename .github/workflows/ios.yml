name: iOS Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify SDR-to-HLG transfer math
        run: python scripts/verify_hdr_math.py

      - name: Cache converted models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: Models
          key: coreml-models-v1-${{ runner.os }}-${{ hashFiles('scripts/convert_coreml.py') }}

      - name: Install converter deps
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" torch==2.4.1 coremltools==8.1

      - name: Convert Real-ESRGAN weights to Core ML (zero training)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/convert_coreml.py --out Models

      - name: List models
        run: ls -la Models || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Toolchain info
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PixelLift.xcodeproj \
            -scheme PixelLift \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PixelLift.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package unsigned IPA
        run: |
          ls -la build/PixelLift.xcarchive/Products/Applications/
          rm -rf Payload && mkdir -p Payload
          cp -R build/PixelLift.xcarchive/Products/Applications/PixelLift.app Payload/
          chmod 755 Payload/PixelLift.app/PixelLift
          # zip 包最保守：根只有 Payload/，无 __MACOSX / AppleDouble，权限位仍是 unix
          # （后者是部分安装器判定「不是 IPA」的原因）
          rm -f PixelLift.ipa
          zip -r -X -q PixelLift.ipa Payload
          shasum -a 256 PixelLift.ipa | tee PixelLift.ipa.sha256
          ls -lh PixelLift.ipa
          unzip -l PixelLift.ipa | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/PixelLift.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/PixelLift.app/Info.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelLift-ipa-v0.1.${{ github.run_number }}
          path: |
            PixelLift.ipa
            PixelLift.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PixelLift v0.1.${{ github.run_number }} · 视频 SDR→HDR HLG + 图片/视频增强
          make_latest: true
          files: |
            PixelLift.ipa
            PixelLift.ipa.sha256
          fail_on_unmatched_files: true
          body: |
            **PixelLift** 是 iOS 上的本地图片/视频画质增强工具（AI 超分 / 补帧 / 慢动作 / 动态模糊 / SDR→HDR）。
            图片和视频在一个 App 里，处理全在本机，不上传、不订阅。

            ### 本版新增：SDR→HDR（HLG / 10-bit）
            - 逐像素处理：Rec.709 SDR → 线性光 → 可调高光肩部 → Rec.2020 → BT.2100 HLG → P010 10-bit HEVC
            - 写入 Rec.2020 primaries/matrix 与 HLG transfer metadata；关闭时保留 Rec.709 SDR 输出
            - SDR 白映射至 HLG reference white；输入已经裁掉的高光纹理不会凭空恢复
            - 开 HDR 时输出最高约 1080p/2.1MP；必须使用支持 HLG 的设备/播放器验收观感
            - 数学探针与 CI 编译通过不等于真机 HDR 质量验收；本版尚无 HDR 屏幕实测

            ### 已有：补帧 / 慢动作 / 动态模糊（M3）
            - **光流补帧** ×2 / ×4：Vision `VNGenerateOpticalFlowRequest` 求逐像素位移，
              双向 warp 后按相位融合，30fps 变 60/120fps
            - **慢动作** 0.5× / 0.25×：时间轴拉长，多出来的采样点全部由光流合成
            - **动态模糊** 轻 / 强：同一时刻前后 3 / 5 个采样加权平均，近似快门拖影
            - 三者与超分、倍率正交组合；慢动作改时长，所以这一单不带原音轨
            - 补帧或慢动作把输出限制在 1080p 级、动态模糊再降一档，保证单帧耗时可控
            - 页面顶部/底部可切「图片 / 视频」两个标签

            ### 视频侧（M2 起）
            - 相册选视频或「文件」导入，读出分辨率 / 时长 / 帧率
            - **快速放大**：CoreGraphics 高质量重采样，接近实时
            - **AI 逐帧超分**：每帧分块跑 Real-ESRGAN（照片 / 动漫两档模型）
            - 输出上限 4K / 830 万像素，HEVC 封装 mp4，进度 / 暂停 / 取消 / 存相册 / 分享

            ### 图片侧（沿用上一版，已修 AI 重建分辨率）
            - 原生 4× AI 重建，倍率 1.5×~8× + 自定义宽度，批量处理、文件导入
            - AI 输入分辨率改为「目标尺寸 ÷ 4」（上限长边 2048px），不再固定 1024px
            - 进度条带过渡动画

            ### 安装
            1. 点本页 `PixelLift.ipa` 下载（**确认已真正下载到本机**，别停在 iCloud 云图标状态）；
            2. 需要校验的话，`PixelLift.ipa.sha256` 是同一版本的 sha256，比对大小和哈希可排除半截包；
            3. LiveContainer：`+` → 从 IPA 安装 → 选文件；装不上时优先确认文件在「我的 iPhone」本地目录；
            4. 也可用 Sideloadly / AltStore 自签（免费 Apple ID，7 天有效，到期重签）。

            ### 已知取舍
            - AI 逐帧超分按帧计时，10 秒 30fps 的片子要几分钟，处理时保持前台
            - 补帧走光流，大面积遮挡 / 闪烁 / 快速横移处可能有轻微拖影
            - 慢动作不带音轨；HDR 效果受 SDR 源素材和显示设备限制
            - 视频输出统一重编码为 HEVC，不做逐帧元数据保留

