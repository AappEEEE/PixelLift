name: iOS Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify SDR-to-HLG transfer math
        run: python scripts/verify_hdr_math.py

      - name: Cache converted models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: Models
          key: coreml-models-v1-${{ runner.os }}-${{ hashFiles('scripts/convert_coreml.py') }}

      - name: Install converter deps
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" torch==2.4.1 coremltools==8.1

      - name: Convert Real-ESRGAN weights to Core ML (zero training)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/convert_coreml.py --out Models

      - name: List models
        run: ls -la Models || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Select Xcode 26 (iOS 26 SDK → Liquid Glass)
        run: |
          # 镜像默认是 Xcode 16.4（iOS 18 SDK），用旧 SDK 链接出来的 App 在 iOS 26 上
          # 会走"兼容外观"，系统 TabBar 不会应用 Liquid Glass。这里切到 Xcode 26，
          # 让系统控件按新设计渲染；部署目标仍是 iOS 17，旧系统回落经典外观。
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.0.1.app ; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              echo "selected $candidate"
              break
            fi
          done

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PixelLift.xcodeproj \
            -scheme PixelLift \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PixelLift.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package unsigned IPA
        run: |
          ls -la build/PixelLift.xcarchive/Products/Applications/
          rm -rf Payload && mkdir -p Payload
          cp -R build/PixelLift.xcarchive/Products/Applications/PixelLift.app Payload/
          chmod 755 Payload/PixelLift.app/PixelLift
          # zip 包最保守：根只有 Payload/，无 __MACOSX / AppleDouble，权限位仍是 unix
          # （后者是部分安装器判定「不是 IPA」的原因）
          rm -f PixelLift.ipa
          zip -r -X -q PixelLift.ipa Payload
          shasum -a 256 PixelLift.ipa | tee PixelLift.ipa.sha256
          ls -lh PixelLift.ipa
          unzip -l PixelLift.ipa | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/PixelLift.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/PixelLift.app/Info.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelLift-ipa-v0.1.${{ github.run_number }}
          path: |
            PixelLift.ipa
            PixelLift.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PixelLift v0.1.${{ github.run_number }} · M0–M7（HDR / 补帧 / 系统 Liquid Glass 导航）
          make_latest: true
          files: |
            PixelLift.ipa
            PixelLift.ipa.sha256
          fail_on_unmatched_files: true
          body: |
            **PixelLift** 是 iOS 上的本地图片/视频画质增强工具（AI 超分 / 补帧 / 慢动作 / 动态模糊 / SDR→HDR）。
            图片和视频在一个 App 里，处理全在本机，不上传、不订阅。

            ### 本版新增（M6 / M7）
            - **动态模糊（M6）**：改成按真实快门做时间积分。窗宽 = 快门角/360，窗内等权采样（中点法则），
              锚定帧起点所以永远不需要第三帧；在线性光里累积；采样数按光流幅值逐块自适应（静止画面几乎零开销）。
              快门角 90°/180°/270°/360°，采样预算 4/10/20。
            - **画质打磨（M7）**：锐化改在亮度域做，用 5-tap 二项式取保边低频，软门限压噪声、边缘衰减防「越锐越脏」，
              最后把输出钳制到源局部极值 —— 硬阶跃光晕从 28 码降到 0 码；量化前加 4×4 Bayer 抖动防 banding。
              新增「降噪」滑杆（默认 30%）。
            - **抗闪烁升级**：改成逐像素自适应权重（静止区最高 0.80，运动区 0.06，切镜处几乎不融合），
              并修掉旧实现每帧整帧 COW 的额外拷贝。
            - **分片导出 + 断点续传（M5）**：SDR 按 20 秒切段，中断后「接着做」从断点继续，
              最后 `AVMutableComposition` + passthrough 拼接（不重编码）。HDR 为保证 10-bit 元数据完整，仍走单条输出。
            - **超采样 AI 输入**：AI 不再先把原帧缩到「目标 ÷ 4」，而是在贴近原片的分辨率上 4× 重建再缩下来。
            - **剩余时间**：进度条旁显示预计剩余（暂停时长不计入）。
            - **底部导航改用系统 TabView**：不再自绘材质胶囊条（那只是"看起来像玻璃"，材质/模糊/高光/与滚动内容联动都不由系统控制），
              改成标准 `TabView` + `.tabItem`。CI 现在用 **Xcode 26 / iOS 26 SDK** 编译，
              所以在 iOS 26 上标签栏由系统按 Liquid Glass 渲染（含滚动边缘效果与按压形变）；iOS 17–18 回落到经典标签栏。

            ### SDR→HDR（M4）
            - 逐像素：Rec.709 SDR → 线性光 → 可调高光肩部 → Rec.2020 → BT.2100 HLG → P010 10-bit HEVC
            - 写入 Rec.2020 primaries/matrix 与 HLG transfer metadata；关闭时保留 Rec.709 SDR 输出
            - 输入已经裁掉的高光纹理不会凭空恢复；必须用支持 HLG 的设备/播放器验收
            - 输出上限与 SDR 相同（4K / 830 万像素），P010 单帧缓冲只有同尺寸 BGRA 的一半
            - CI 编译与数学探针通过 ≠ 真机 HDR 观感已验证，本版仍无 HDR 屏幕实测

            ### 补帧 / 慢动作（M3）
            - **光流补帧** ×2 / ×4：Vision `VNGenerateOpticalFlowRequest` 求逐像素位移，双向 warp 后按相位融合
            - **慢动作** 0.5× / 0.25×：时间轴拉长，多出来的采样点全部由光流合成
            - 与超分、倍率正交组合；慢动作改时长，所以这一单不带原音轨

            ### 视频基础（M2）
            - 相册选视频或「文件」导入，读出分辨率 / 时长 / 帧率
            - **快速放大**：CoreGraphics 高质量重采样，接近实时；**AI 逐帧超分**：Real-ESRGAN 照片/动漫两档
            - 输出上限 4K / 830 万像素，HEVC 封装 mp4，进度 / 暂停 / 取消 / 存相册 / 分享

            ### 图片侧（M1）
            - 原生 4× AI 重建，倍率 1.5×~8× + 自定义宽度，批量处理、文件导入
            - AI 输入分辨率取「目标尺寸 ÷ 4」（上限长边 2048px）

            ### 安装
            1. 点本页 `PixelLift.ipa` 下载（**确认已真正下载到本机**，别停在 iCloud 云图标状态）；
            2. 需要校验的话，`PixelLift.ipa.sha256` 是同一版本的 sha256，比对大小和哈希可排除半截包；
            3. LiveContainer：`+` → 从 IPA 安装 → 选文件；装不上时优先确认文件在「我的 iPhone」本地目录；
            4. 也可用 Sideloadly / AltStore 自签（免费 Apple ID，7 天有效，到期重签）。

            ### 已知取舍
            - AI 逐帧超分按帧计时，10 秒 30fps 的片子要几分钟，处理时保持前台
            - 补帧走光流，大面积遮挡 / 闪烁 / 快速横移处可能有轻微拖影
            - 分片边界每片会多 1 帧；跨片不补中间帧
            - 慢动作不带音轨；HDR 效果受 SDR 源素材和显示设备限制
            - 视频输出统一重编码为 HEVC，不做逐帧元数据保留

