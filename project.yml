name: PixelLift
options:
  bundleIdPrefix: com.pixellift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PixelLift:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Models
        buildPhase: resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PixelLift
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSPhotoLibraryUsageDescription: 需要读取相册中的图片用于本地超分处理。
        NSPhotoLibraryAddUsageDescription: 需要把超分结果保存回你的相册。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixellift.app
        PRODUCT_NAME: PixelLift
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  PixelLift:
    build:
      targets:
        PixelLift: all
    run:
      config: Release
    archive:
      config: Release
